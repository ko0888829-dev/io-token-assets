<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IO Mining - Admin Payout & Security Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070d18;
      --card-bg: #0e1726;
      --card-border: #1a273f;
      --accent-gold: #f59e0b;
      --accent-cyan: #00d2ff;
      --accent-red: #ff4757;
      --accent-green: #2ed573;
      --text-main: #ffffff;
      --text-sub: #7e8fa6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px 14px; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; margin-bottom: 16px; }
    .header h1 { font-size: 18px; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
    .badge-admin { background: #261907; color: var(--accent-gold); border: 1px solid var(--accent-gold); }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .cheat-alert { background: #2b0c11; border: 1px solid var(--accent-red); color: #ff6b81; padding: 10px; border-radius: 10px; font-size: 11px; margin-bottom: 12px; }
    .user-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
    .wallet-box { background: #060c16; padding: 10px; border-radius: 8px; font-size: 11px; margin: 10px 0; border: 1px solid var(--card-border); word-break: break-all; }
    .copy-btn { background: #132238; color: var(--accent-cyan); padding: 3px 10px; border-radius: 4px; border: 1px solid var(--card-border); font-size: 11px; cursor: pointer; font-weight: 700; float: right; }
    .tx-input { width: 100%; background: #08111e; border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; color: #fff; font-size: 13px; margin: 8px 0; outline: none; }
    .btn-action { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-payout { background: linear-gradient(90deg, #f59e0b, #d97706); color: #000; }
    .btn-refresh { background: #132238; color: #fff; padding: 6px 14px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>⚙️ IO Payout & Fraud Shield</h1>
      <div style="font-size: 11px; color: var(--text-sub); margin-top: 2px;">Real-time IP, Device Tracking & Auto-Receipt</div>
    </div>
    <button class="btn-refresh" onclick="loadRequests()">🔄 Refresh</button>
  </div>

  <div id="requests-list">
    <div style="text-align: center; color: var(--text-sub); padding: 40px;">Loading requests...</div>
  </div>
</div>

<script>
  const API_URL = "/.netlify/functions/payout";

  async function loadRequests() {
    const container = document.getElementById("requests-list");
    container.innerHTML = "<div style='text-align:center;color:var(--text-sub);padding:30px;'>Fetching data...</div>";

    try {
      const res = await fetch(API_URL);
      const list = await res.json();

      if (!list || list.length === 0) {
        container.innerHTML = "<div style='text-align:center;color:var(--text-sub);padding:40px;'>No pending withdrawal requests. All done! 🎉</div>";
        return;
      }

      // Duplicate IP / Device စစ်ဆေးခြင်း
      const ipCounts = {};
      list.forEach(item => {
        ipCounts[item.ip] = (ipCounts[item.ip] || 0) + 1;
      });

      container.innerHTML = "";
      list.forEach((req, idx) => {
        const isSuspicious = ipCounts[req.ip] > 1;

        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${req.claimId}`;
        card.innerHTML = `
          ${isSuspicious ? `
            <div class="cheat-alert">
              ⚠️ <b>POTENTIAL MULTI-ACCOUNT DETECTED!</b><br>
              This IP (<code>${req.ip}</code>) has requested multiple withdrawals across different accounts. Verify carefully!
            </div>
          ` : ''}

          <div class="user-row">
            <b style="color:var(--accent-gold); font-size:16px;">#${req.claimId}</b>
            <span style="font-size:11px; color:var(--text-sub);">${req.date}</span>
          </div>

          <div class="user-row">
            <span>User: <b>@${req.username}</b> (ID: <code>${req.userId}</code>)</span>
            <span style="color:var(--accent-green); font-weight:800; font-size:15px;">Net: ${req.net} IO</span>
          </div>

          <div style="font-size:11px; color:var(--text-sub); margin-top:4px;">
            🌐 IP: <code>${req.ip}</code> &bull; 📱 Device: <code>${req.device}</code>
          </div>

          <div class="wallet-box">
            <div style="margin-bottom:6px;">
              <span style="color:var(--text-sub);">Ton Payout Address:</span>
              <button class="copy-btn" onclick="copyText('${req.wallet}')">Copy Address</button>
            </div>
            <code>${req.wallet}</code>
          </div>

          <div style="font-size:11px; color:var(--text-sub);">Tonkeeper Transaction Hash:</div>
          <input type="text" id="hash-${idx}" class="tx-input" placeholder="Paste hash here" value="54d010e61441053f9778e27e62ad15dee209ba749444e765402cb4ba41889e5e">

          <button class="btn-action btn-payout" onclick="sendPayoutReceipt('${req.userId}', '${req.claimId}', '${req.net}', 'hash-${idx}')">
            🚀 Send Official Receipt to User
          </button>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      container.innerHTML = "<div style='color:#ff4757;text-align:center;'>Failed to load requests from server.</div>";
    }
  }

  function copyText(val) {
    navigator.clipboard.writeText(val).then(() => alert("Address copied to clipboard!"));
  }

  async function sendPayoutReceipt(userId, claimId, amount, inputId) {
    const txHash = document.getElementById(inputId).value.trim();
    if (!txHash) {
      alert("Please enter Transaction Hash!");
      return;
    }

    const btn = event.target;
    btn.disabled = true;
    btn.innerText = "Sending Receipt via Bot...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "complete",
          targetUserId: userId,
          claimId: claimId,
          amount: amount,
          txHash: txHash
        })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById(`card-${claimId}`).innerHTML = `
          <div style="text-align:center; color:var(--accent-green); padding:16px;">
            <h3>✅ Payout Complete!</h3>
            <p style="font-size:12px; color:var(--text-sub); margin-top:4px;">Official receipt with Tonviewer link sent directly to User ID ${userId}.</p>
          </div>
        `;
        alert("Receipt sent directly to user's Telegram chat successfully!");
      }
    } catch (e) {
      alert("Error sending payout: " + e.message);
      btn.disabled = false;
      btn.innerText = "🚀 Send Official Receipt to User";
    }
  }

  loadRequests();
</script>
</body>
</html>
